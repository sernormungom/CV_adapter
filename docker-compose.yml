# Local production-like stack: Postgres + one-shot migrations + web app. The web
# app runs with AUTH_ENFORCED on. Jobs are created/edited in the cloud UI; no
# collector/scheduler process runs here (ADR-010).

x-app-base: &app-base
  build:
    context: .
  image: cv-adapter:local
  env_file:
    - .env
  volumes:
    - ./data:/app/data
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

x-app-env: &app-env
  DATA_DIR: /app/data/profiles
  JOB_STORE_DIR: /app/data/job_store/jobs
  APPLICATION_TRACKER_DIR: /app/data/application_tracker
  TA_CONFIG_DIR: /app/data/ta_config
  DATABASE_URL: postgresql+psycopg://cvadapter:cvadapter@db:5432/cvadapter

services:
  db:
    image: postgres:16
    container_name: cv-adapter-db
    environment:
      POSTGRES_USER: cvadapter
      POSTGRES_PASSWORD: cvadapter
      POSTGRES_DB: cvadapter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvadapter -d cvadapter"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot schema migration. Runs to completion before app/watcher start, so
  # a fresh environment comes up with the schema in place and replicas never race.
  migrate:
    <<: *app-base
    container_name: cv-adapter-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  app:
    <<: *app-base
    container_name: cv-adapter-app
    environment:
      <<: *app-env
      AUTH_ENFORCED: "true"
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
