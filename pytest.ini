[pytest]
pythonpath = .
testpaths = tests

# An unknown marker is an error, not a warning: a typo in `-m` or in a
# `pytestmark` would otherwise silently select nothing and report success.
addopts = --strict-markers --strict-config

markers =
    fast: no external service needed (SQLite or pure Python). Applied automatically. The developer loop.
    static: static-client (HTML/JS/CSS) contract test. Set via a module-level pytestmark.
    integration: needs a disposable Postgres 16. Applied automatically to tests under tests/integration/.
    complete: the whole suite — the release gate. Applied automatically to every test.

# See docs/testing.md for the four gates and their Make targets.
