<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set your password – Mpya</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--acc:#972182;--ink:#1c1c1c;--ink-mid:#444;--ink-soft:#888;--grey-dark:#ccc8c0;--sans:'Source Sans 3',sans-serif;--serif:'Source Serif 4',serif;--red:#b71c1c;--green:#2a7a3b}
html,body{height:100%;font-family:var(--sans);background:#bbb8b0;color:var(--ink);font-size:14px}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#f4f3f1;border:1px solid var(--grey-dark);border-radius:3px;width:100%;max-width:380px;padding:32px 30px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.logo{font-family:var(--serif);font-size:18px;color:#fff;background:var(--acc);padding:6px 14px;border-radius:2px;display:inline-block;letter-spacing:.03em}
h1{font-family:var(--serif);font-size:22px;margin:22px 0 4px}
.sub{color:var(--ink-soft);font-size:13px;margin-bottom:22px}
label{display:block;font-size:12px;font-weight:600;color:var(--ink-mid);margin:14px 0 5px}
input{width:100%;padding:10px 12px;font-family:var(--sans);font-size:14px;border:1px solid var(--grey-dark);border-radius:2px;background:#fff}
input:focus{outline:none;border-color:var(--acc)}
.hint{font-size:11px;color:var(--ink-soft);margin-top:5px}
button{width:100%;margin-top:22px;padding:11px;font-family:var(--sans);font-size:14px;font-weight:600;color:#fff;background:var(--acc);border:none;border-radius:2px;cursor:pointer}
button:hover{background:#6e1860}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{display:none;margin-top:16px;padding:9px 12px;font-size:13px;border-radius:2px}
.msg.show{display:block}
.msg.err{color:var(--red);background:#ffebee;border:1px solid #ffcdd2}
.msg.ok{color:var(--green);background:#e8f5e9;border:1px solid #c8e6c9}
</style>
</head>
<body>
<div class="wrap">
  <form class="card" id="form">
    <span class="logo">MPYA Set password</span>
    <h1>Set your password</h1>
    <div class="sub">Choose a password to activate your account.</div>

    <label for="password">New password</label>
    <input id="password" type="password" autocomplete="new-password" required>
    <div class="hint">At least 12 characters, including an uppercase letter, a number, and a symbol.</div>

    <label for="confirm">Confirm password</label>
    <input id="confirm" type="password" autocomplete="new-password" required>

    <button type="submit" id="btn">Set password &amp; continue</button>
    <div class="msg" id="msg"></div>
  </form>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token') || '';
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');

function show(kind, text){ msg.className = 'msg show ' + kind; msg.textContent = text; }

if (!token) {
  show('err', 'This link is missing its invite token. Ask your administrator for a new invite.');
  btn.disabled = true;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  // Courtesy check only — the server's policy
  // (backend/auth/service.py::validate_password_policy) is the authority, and
  // its message is shown verbatim from the response when this misses a case.
  if (pw.length < 12) { show('err', 'Password must be at least 12 characters.'); return; }
  if (!/[A-Z]/.test(pw)) { show('err', 'Password must include an uppercase letter.'); return; }
  if (!/[0-9]/.test(pw)) { show('err', 'Password must include a number.'); return; }
  if (!/[^A-Za-z0-9]/.test(pw)) { show('err', 'Password must include a symbol.'); return; }
  if (pw !== confirm) { show('err', 'Passwords do not match.'); return; }

  btn.disabled = true; btn.textContent = 'Setting password…';
  try {
    const r = await fetch('/api/auth/invite/accept', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'same-origin',
      body: JSON.stringify({ token, password: pw }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      show('err', data.detail || 'Could not set password. The invite may have expired.');
      btn.disabled = false; btn.textContent = 'Set password & continue';
      return;
    }
    show('ok', 'Password set. Redirecting…');
    window.location.href = data.landing || '/html/cv-importer.html';
  } catch (_) {
    show('err', 'Could not reach the server.');
    btn.disabled = false; btn.textContent = 'Set password & continue';
  }
});
</script>
</body>
</html>
