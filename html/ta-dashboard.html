<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talent Advisor – Mpya</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Source Sans 3',sans-serif;background:#bbb8b0;color:#1c1c1c;font-size:14px}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
h1{font-family:'Source Serif 4',serif;font-size:22px;margin-bottom:8px}
p{color:#444;font-size:13px}
a{color:#972182}
</style>
</head>
<body>
<!-- V3-P-003 (S6) renamed this surface to Consultants (html/consultants.html).
     This file survives only as a redirect shim: the server's own post-login
     landing map (backend/auth/routes.py::_LANDING) is out of this packet's
     scope and still points every Talent Advisor here by path, so the URL
     itself cannot be retired — only what it serves. -->
<div class="wrap">
  <div>
    <h1>Talent Advisor</h1>
    <p>This has moved to <a href="/html/consultants.html">Consultants</a>. Redirecting…</p>
  </div>
</div>
<script src="/html/auth-guard.js"></script>
<script>
(async () => {
  await requireAuth(['ta','admin']);
  window.location.replace('/html/consultants.html' + location.search);
})();
</script>
</body>
</html>
